[package]
name = "kaibot-terminal"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kaibot_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: self-update (signed), relaunch, and login-item autostart.
# Pinned to the 2.5-era to stay on the known-good tauri 2.5.x runtime stack
# (the 2.10.x line currently ships a broken tauri-runtime-wry/wry combo).
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "~2.5"
tauri-plugin-process = "~2.2"
tauri-plugin-autostart = "~2.3"

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26"
window-vibrancy = "0.5"

